<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spell Cards</title>
<style>
  :root{
    --ink:#1a1512; --muted:#6b615a; --rule:#c9bfb4; --paper:#fffdfa;
    --c-innate:#7a3b8f; --c-initiate:#1f5f8b; --c-class:#8a6a1f;
    --c-species:#a8791b; --c-campaign:#3f6b47; --c-feature:#8b3a3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#e8e3db; color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .toolbar{
    position:sticky; top:0; z-index:10; background:#2b2521; color:#f4efe8;
    padding:.7rem 1rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap;
    font-family:system-ui,-apple-system,sans-serif; font-size:.85rem;
  }
  .toolbar strong{font-size:.95rem;}
  .toolbar button{font:inherit;cursor:pointer;background:#c9a227;color:#241f1b;border:0;padding:.4rem .9rem;border-radius:4px;font-weight:600;}
  .toolbar span{color:#b9afa4;}
  .err{background:#7c1f1f;color:#fff;padding:1rem 1.2rem;font-family:system-ui,sans-serif;font-size:.9rem;line-height:1.5;}
  .err code{background:rgba(255,255,255,.15);padding:1px 4px;border-radius:3px;}

  .sheet{display:grid;grid-template-columns:repeat(3,2.5in);gap:.12in;justify-content:center;padding:.4in 0;}
  .card{
    width:2.5in; height:3.35in; background:var(--paper);
    border:1px solid var(--rule); border-radius:.09in;
    padding:.13in .15in .1in; display:flex; flex-direction:column;
    overflow:hidden; break-inside:avoid; page-break-inside:avoid;
    box-shadow:0 1px 3px rgba(0,0,0,.13);
  }
  .band{height:.055in;margin:-.13in -.15in .09in;border-radius:.09in .09in 0 0;}
  .card h2{margin:0;font-size:11.5pt;line-height:1.1;letter-spacing:.1px;}
  .sub{margin:.02in 0 .07in;font-size:6.7pt;font-style:italic;color:var(--muted);letter-spacing:.2px;}
  .meta{
    display:grid;grid-template-columns:auto 1fr;gap:0 .07in;font-size:6.6pt;line-height:1.42;
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
    padding:.05in 0;margin-bottom:.07in;
  }
  .meta dt{font-family:system-ui,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.35px;font-size:5.6pt;color:var(--muted);margin:0;padding-top:.4pt;}
  .meta dd{margin:0;}
  .body{font-size:7.4pt;line-height:1.34;flex:1;overflow:hidden;}
  .body p{margin:0 0 .055in;}
  .body ul{margin:.02in 0 .055in;padding-left:.12in;}
  .body li{margin-bottom:.02in;}
  .hit{display:inline-block;background:#efe7d8;border:1px solid #d8cbb2;border-radius:2px;padding:0 2.5px;font-weight:700;font-size:7.2pt;}
  .note{color:var(--muted);font-style:italic;font-size:6.7pt;}
  .lede{font-style:normal;color:var(--ink);}
  .tiny{font-size:6.5pt;line-height:1.3;}
  .foot{
    margin-top:auto;padding-top:.05in;border-top:1px solid var(--rule);
    display:flex;justify-content:space-between;gap:.06in;
    font-family:system-ui,sans-serif;font-size:5.7pt;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
  }
  .foot b{font-weight:700;color:var(--ink);}

  @media print{
    body{background:#fff;}
    .toolbar{display:none;}
    .sheet{padding:0;gap:0;}
    .card{box-shadow:none;border:1px dashed #b3a99d;border-radius:0;margin:0;}
    @page{size:letter portrait;margin:.35in;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="character.js"></script>
<script>
(function(){
  const C = window.CHARACTER;
  const root = document.getElementById("root");
  if(!C){
    root.innerHTML = '<div class="err"><b>No character data found.</b><br>'+
      'This page expects a <code>character.js</code> beside it that sets '+
      '<code>window.CHARACTER = {…}</code>.</div>';
    return;
  }
  const cards = C.cards || [];
  if(!cards.length){
    root.innerHTML = '<div class="err"><b>No cards defined.</b><br>'+
      'Add a <code>cards: [ … ]</code> array to character.js.</div>';
    return;
  }

  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.innerHTML = cards.map(function(c){
    const meta = Object.keys(c.meta || {})
      .map(k => '<dt>'+k+'</dt><dd>'+c.meta[k]+'</dd>').join('');
    const foot = c.foot || [];
    return '<div class="card">'+
      '<div class="band" style="background:var(--c-'+(c.colour||"class")+')"></div>'+
      '<h2>'+c.name+'</h2>'+
      (c.sub ? '<p class="sub">'+c.sub+'</p>' : '')+
      (meta ? '<dl class="meta">'+meta+'</dl>' : '')+
      '<div class="body">'+(c.bodyHtml||"")+'</div>'+
      '<div class="foot"><span>'+(foot[0]||"")+'</span><span><b>'+(foot[1]||"")+'</b></span></div>'+
    '</div>';
  }).join('');
  root.appendChild(sheet);

  document.title = C.name + " — Spell Cards";
  const tb = document.createElement("div");
  tb.className = "toolbar";
  tb.innerHTML = '<strong>'+C.name+' — Spell &amp; Ability Cards</strong>'+
    '<button onclick="window.print()">Print / Save as PDF</button>'+
    '<span>'+cards.length+' cards · 2.5&times;3.35 in · 9 per page</span>';
  document.body.insertBefore(tb, root);
})();
</script>
</body>
</html>
